[project]
name = "contextportal"
version = "0.4.0"
description = "The authenticated fetch layer for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "NavadeepDj" }
]
keywords = [
    "mcp",
    "ai-agents",
    "retrieval",
    "browser-automation",
    "context-proxy",
    "security"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "redis[hiredis]>=5.0.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "playwright>=1.62.0",
    "readability-lxml>=0.8.4.1",
    "markdownify>=1.2.3",
    "mcp[cli]>=2.1.1",
    "packaging>=23.0",
    "serpapi>=1.1.2",
]

[project.urls]
Homepage = "https://github.com/NavadeepDj/ContextPortal"
Repository = "https://github.com/NavadeepDj/ContextPortal"
Issues = "https://github.com/NavadeepDj/ContextPortal/issues"

[project.scripts]
contextportal = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "twine>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "readability.*",
    "markdownify.*",
    "mcp.*",
    "serpapi.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pyright]
include = ["app", "tests"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
